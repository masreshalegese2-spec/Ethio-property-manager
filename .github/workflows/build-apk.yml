name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for gradlew
      run: chmod +x Property_Finance_Manager_And_Construction_Spec/gradlew

    - name: Build Debug APK with Gradle
      run: ./gradlew assembleDebug
      working-directory: Property_Finance_Manager_And_Construction_Spec

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: Property_Finance_Manager_And_Construction_Spec/app/build/outputs/apk/debug/app-debug.apk
